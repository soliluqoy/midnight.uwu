name: vault
description: Experimental direct peer messenger with local history and optional media libraries.
publish_to: none
version: 0.3.0+4007

environment:
  sdk: ^3.13.5
resolution: workspace

dependencies:
  camera: 0.12.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  sqlite3: 3.7.1
  vault_delivery:
    path: ../../packages/vault_delivery
  vault_directory:
    path: ../../packages/vault_directory
  vault_identity:
    path: ../../packages/vault_identity
  vault_media_index:
    path: ../../packages/vault_media_index
  vault_net:
    path: ../../packages/vault_net
  vault_player:
    path: ../../packages/vault_player
  vault_protocol:
    path: ../../packages/vault_protocol
  vault_signaling:
    path: ../../packages/vault_signaling
  vault_ui:
    path: ../../packages/vault_ui
  zxing2: 0.2.4

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/media/
    - assets/fonts/OFL.txt
  fonts:
    - family: VaultSerif
      fonts:
        - asset: assets/fonts/Lora.ttf
