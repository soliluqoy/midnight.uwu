name: vault
# Monorepo orchestration. See docs/FILE_TREE.md for the package responsibilities.
#
#   dart pub global activate melos
#   melos bootstrap
#
# The layering rule (plan §4) is enforced by package imports, not by melos, but
# `melos run analyze` runs analysis across every package at once so a layering
# violation surfaces in one command.

sdk: '>=3.9.0 <4.0.0'

packages:
  - apps/vault
  - packages/*

ignore:
  - '**/*.g.dart'
  - '**/*.freezed.dart'
  - 'tools/interop_harness/**'
  - 'spikes/**'

scripts:
  # ---- setup -------------------------------------------------------------
  bootstrap:
    name: bootstrap
    run: dart pub get
    description: Resolve dependencies for every package in the workspace.

  # ---- codegen -----------------------------------------------------------
  gen:
    name: gen
    run: melos exec -- "dart run build_runner build --delete-conflicting-outputs"
    description: Regenerate drift, json_serializable and riverpod code.
    packageFilters:
      dirExists: lib

  # ---- quality gates (plan §8) ------------------------------------------
  analyze:
    name: analyze
    run: melos exec -- "dart analyze --fatal-infos ."
    description: Strict analysis across all packages. Must be clean.

  format:
    name: format
    run: melos exec -- "dart format --set-exit-if-changed ."
    description: Verify formatting.

  test:
    name: test
    run: melos exec --scope='vault_*' -- "flutter test"
    description: Unit and widget tests for every package.

  # The plan mandates 100% coverage on exactly these four targets. Keep the list
  # explicit so a coverage regression fails loudly rather than silently.
  coverage:strict:
    name: coverage (strict targets)
    run: melos exec --dir-exists=test --scope='vault_protocol' -- "flutter test --coverage"
    description: vault_protocol requires 100% coverage.

  # ---- verification harness ---------------------------------------------
  interop:
    name: interop harness (pion)
    run: cd tools/interop_harness && go test ./... -v
    description: Run the pion/webrtc other-side harness. Phase 0 spikes depend on this.

  # ---- convenience -------------------------------------------------------
  doctor:
    name: toolchain doctor
    run: powershell -ExecutionPolicy Bypass -File tools/setup/verify-toolchain.ps1
    description: Verify the local toolchain can build both platforms.

  run:windows:
    name: run (windows)
    run: cd apps/vault && flutter run -d windows
    description: Run the app on Windows desktop.

  run:android:
    name: run (android)
    run: cd apps/vault && flutter run -d emulator-5554
    description: Run the app on the vault36 emulator.